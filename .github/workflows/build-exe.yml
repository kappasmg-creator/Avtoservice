yaml
name: Build AvtoServis.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --name AvtoServis app.py
      - name: Save result
        uses: actions/upload-artifact@v4
        with:
          name: AvtoServis-exe
          path: dist/AvtoServis.exe
      - name: Run tests (optional)
        continue-on-error: true
        run: python test_app.py
